<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="reports.css" />
  </head>

  <body>
    <header class="pb-5">
      <nav class="navbar navbar-expand-lg mb-5" id="navbar_page">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarText"
            aria-controls="navbarText"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <img
                  class="navbar-item"
                  src="/images/fysiko aerio ellados mask.png" />
              </li>
              <li class="nav-item">
                <p class="navbar-text" style="color: aliceblue">
                  fysikoaerioellados
                </p>
              </li>
            </ul>
            <ul class="navbar-nav me-2 mb-2 mb-lg-0">
              <li class="nav-item">
                <button
                  type="button"
                  class="btn text-light"
                  onclick="window.location.href='login.html'"
                >
                  <img class="person" src="/images/personal_photo.png" height="25" />
                  Maria Spachou
                </button>
              </li>
            </ul>
          </div>
        </div>
      </nav>  
      <div class="container">
        <span class="word1"> Sales Reports </span>
        <span class="word2"> Campaign Reports </span>
      </div>
      <div class="bar-3d"></div>
      <div class="pie">
        <div class="html">19% HTML</div>
        <div class="css">81% CSS</div>
      </div>
      <span class="word3"> Revenue Reports </span> 
      <div class="donut" style="--first: .40; --second: .33; --third: .12; --fourth: .08; --fifth: 0.07">
        <div class="donut__slice donut__slice__first"></div>
        <div class="donut__slice donut__slice__second"></div>
        <div class="donut__slice donut__slice__third"></div>
        <div class="donut__slice donut__slice__fourth"></div>
        <div class="donut__slice donut__slice__fifth"></div>
        <div class="donut__label">
          <div class="donut__label__heading">Donut Charts</div>
          <div class="donut__label__sub">with Pure CSS</div>
        </div>
      </div>         
    </header>
  </body>
</html>
