<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/upgrade3lastphotos.css" />
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui@5.3.1/dist/css/coreui.min.css" rel="stylesheet"
    integrity="sha384-PDUiPu3vDllMfrUHnurV430Qg8chPZTNhY8RUpq89lq22R3PzypXQifBpcpE1eoB" crossorigin="anonymous"/>

  </head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
  </style>
  <script src="/js/upgrade.js"></script>
  

  <body>
    <header class="pb-2 mb-5 d-block">
      <nav class="navbar navbar-expand-lg mb-5" id="navbar_page">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <img class="navbar-item" src="/imag/fysiko.png" />
              <li class="nav-item" id="nav_item">
                <p class="navbar-text" id="fysiko" style="color: aliceblue">
                  fysikoaerioellados
                </p>
              </li>
            </ul>
            <ul class="navbar-nav me-2 mb-2 mb-lg-0">
              <li class="nav-item" id="nav_item">
                <button type="button" class="btn text-light" onclick="window.location.href='login.html'">
                 Kostantia Stergiou
                  <img class="person" src="/myimages/dia.png" height="25" />
                </button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <div class="container-fluid pt-0 pe-5 me-5 ">
      <div class="container-fluid pt-5 pe-0 me-0 ">
        <div class="row">
          <div class="col-1 ms-5 mt-5 " >
            <div
              class="sidebar sidebar-narrow-unfoldable border-end bg-gradient"
              style="margin-top: 135px"
              id="sidebar"
            >
              <div class="sidebar-header border-bottom">
                <div class="sidebar-brand">
                  <img src="/images/house.png" alt="House" height="25" />
                </div>
              </div>
              <ul class="sidebar-nav">
                <li class="nav-title">Campaign Dashboard</li>
                <li class="nav-item"  style="width: 170px;">
                  <a class="nav-link" href="calendar.html">
                    <i class="nav-icon cil-puzzle" id="#"></i>
                    <p style="margin-left:5px ;"> Calendar</p>
                    <img
                      src="/images/Frame.png"
                      alt="Calendar"
                      style="margin-left: 40%"
                      width=""
                    />
                  </a>
                </li>
                <li class="nav-item">
                  <button
                    type="button"
                    class="btn"
                    onclick="window.location.href='upgradedata.html'"
                    style="width: 180px;"
                  >
                    <a class="nav-link" href="#">
                      <i class="nav-icon cil-puzzle" id="nav_icon"></i> 
                      <p style="margin-left:-10px;">Upgrade Data</p>
                      <img
                      src="/images/Data icon.png"
                        class="icon-right"
                        alt="Upgrade Data"
                        style="margin-left: 15%"
                      />
                    </a>
                  </button>
                </li>
                <li class="nav-item">
                  <button
                    type="button"
                    class="btn"
                    onclick="window.location.href='inserts.html'"
                    style="width: 180px;"
                  >
                    <a class="nav-link" href="#">
                      <i class="nav-icon cil-puzzle"></i> 
                      <p style="margin-left:-10px;" >Insert Data</p>
                      <img
                        src="/images/Data icon.png"
                        class="icon-right"
                        alt="Insert Data"
                        style="margin-left: 30%"
                      />
                    </a>
                  </button>
                </li>
                <li class="nav-item">
                  <button
                    type="button"
                    class="btn text-light"
                    onclick="window.location.href='reports.html'"
                    style="width: 180px;"
                  >
                    <a class="nav-link nav-group-toggle" href="#">
                      <i class="nav-icon cil-puzzle"></i>
                      <p style="margin-left:-10px;">Check Reports</p> 
                      <img
                        src="/images/checkreports.png"
                        class="icon-right"
                        alt="Check Reports"
                        style="margin-left: 10%"
                        id="check"
                  
                      />
                    </a>
                  </button>
                </li>
              </ul>
            </div>
          </div>
          <div class="col-10  justify-content-center align-items-start pt-0">
            <div class="container">
              <div class="form-box">
                <h2>Upgrade Data</h2>
                <input type="text" placeholder="Campaign name..." />
                <input type="text" placeholder="duration - dd/mm/yyyy - dd/mm/yyyy" />
                <input type="text" placeholder="requirement 1" />
                <input type="text" placeholder="requirement 2" />
                <div id="extraRequirements"></div>
                <button type="button" id="addRequirementBtn" class="upgrade-button" style="background-color: #9a87fa; color: white; font-weight:bold; margin-bottom: 40px;"> 
                  + Add requirement
                </button>
      
                
                <input type="text" placeholder="criteria 1" />
                <input type="text" placeholder="criteria 2" />
                <div id="extraCriteria"></div>
      
                <button type="button" id="addCriteriaBtn" class="upgrade-button" style= "background-color: #9a87fa; color: white; font-weight:bold ;margin-top: 15px;"> 
                  + Add criteria
                </button>
                <div class="container-fluid pt-5">
                  <table class="table">
                  <thead>
                    <tr>
                      <th scope="col">Customer Id</th>
                      <th scope="col">Customer Name</th>
                    </tr>
                  </thead>
                  <tbody>
                    
                      <tr>
                        <td>c00185</td>
                        <td>Γιώργος Παπαδάκης</td>
                      </tr>
                      <tr>
                        <td>c02001</td>
                        <td>Μαρία Γιαννοπούλου</td>
                      </tr>
                   
                  </tbody>
                </table>
            
                <button type="button" id="addToTheTableBtn" class="upgrade-button" style= "background-color: #9a87fa; color: white; font-weight:bold ;margin-top: 15px;"> 
                  + Add Customer
                </button>
                <button class="upgrade-button" style= "background-color: #9a87fa; color: white; font-weight:bold;"onclick="window.location.href='edit.html'">Upgrade</button>
              </div>
              </div>
            </div>          
          </div>
        </div>
      </div>
    </div>
    <script>
      window.onload = function () {
        const inputs = document.querySelectorAll("input");
        if (inputs.length >= 6) {
          inputs[0].value = "Καμπάνια για προώθηση συμπληρωματικών προιόντων";
          inputs[1].value = "01/01/2025 - 28/02/2025";
          inputs[2].value = "Ενεργό συμβόλαιο σε πακέτο φυσικού αερίου ή ρεύματος";
          inputs[3].value = "Να μην έχει ληξιπρόθεσμες οφειλές.";
          inputs[4].value = "Ιστορικό κατανάλωσης πάνω από 500kWh τον μήνα.";
          inputs[5].value = "Αν έχει δείξει ενδιαφέρον σε προηγούμενες προωθήσεις.";
        }
      };
    </script>
  </body>
</html>
