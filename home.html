<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>

            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarText"
            aria-controls="navbarText"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <img

              </li>
              <li class="nav-item">
                <p class="navbar-text" style="color: aliceblue">
                  fysikoaerioellados

              </li>
            </ul>
            <ul class="navbar-nav me-2 mb-2 mb-lg-0">

                <p class="navbar-item" style="color: aliceblue">Home</p>
              </li>
              <li class="nav-item">
                <p class="navbar-item" style="color: aliceblue">Info</p>
              </li>
              <li class="nav-item">
                <button
                  type="button"
                  class="btn text-light"
                  style="background-color: #023e8a"
                >
                  <img class="person" src="/images/User.SVG.png" height="25" />

                </button>
              </li>
            </ul>
          </div>
        </div>
      </nav>

          <div class="col p-0" id="square2">

              style="width: 100%;"
            />
          </div>
          <div class="col p-0" id="square3"></div>
          <div
            class="col p-0 d-flex align-items-center justify-content-center"
            id="square4"
          >
            <p id="Log_in">Press the button to Log in</p>
