<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="home.css" />
  </head>

  <body>
    <header class="pb-5">
      <nav class="navbar navbar-expand-lg mb-5" id="navbar_page">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarText"
            aria-controls="navbarText"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <img
                  class="navbar-item"
                  src="/images/fysiko aerio ellados mask.png"
                />
              </li>
              <li class="nav-item">
                <p class="navbar-text" style="color: aliceblue">
                  fysikoaerioellados
                </p>
              </li>
            </ul>
            <ul class="navbar-nav me-2 mb-2 mb-lg-0">
              <li class="nav-item">
                <p class="navbar-item" style="color: aliceblue">Home</p>
              </li>
              <li class="nav-item">
                <p class="navbar-item" style="color: aliceblue">Info</p>
              </li>
              <li class="nav-item">
                <button
                  type="button"
                  class="btn text-light"
                  onclick="window.location.href='login.html'"
                >
                  <img class="person" src="/images/User.SVG.png" height="25" />
                  Log in
                </button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <div class="container-fluid mt-5 pt-5">
      <div class="container text-center mb-0">
        <div class="row row-cols-1 row-cols-md-2 g-4">
          <div class="col p-0" id="square1">
            <p class="p-5">
              <strong
                >CAMPAIGN MANAGEMENT <br />
                PLATFORM FOR FYSIKO<br />
                AERIO ELLADOS</strong
              >
            </p>
          </div>
          <div class="col p-0" id="square2">
            <img
              class="img-fluid"
              src="/images/campaign.jpg"
              style="width: 100%"
            />
          </div>
          <div class="col p-0" id="square3"></div>
          <div
            class="col pt-5 d-flex flex-column align-items-center justify-content-center"
            id="square4"
          >
            <p id="Log_in">Press the button to Log in</p>
            <button
              type="button"
              class="btn text-light"
              style="background-color: #023e8a"
              id="btn_log_in"
              onclick="window.location.href='login.html'"
            >
              Log in
            </button>
          </div>
        </div>
      </div>
    </div>
    <footer
      class="text-center text-lg-start p-4 mt-5 border-top"
      style="background-color: #0077b6"
    >
      <div class="container text-center">
        <div class="mb-3">
          <a href="#" class="text-decoration-none text-white mx-3">About us</a>
          <a href="#" class="text-decoration-none text-white mx-3">Contact</a>
          <a href="#" class="text-decoration-none text-white mx-3">Press kit</a>
        </div>
        <div class="mb-3">
          <a href="https://www.facebook.com" target="_blank" class=" mx-2">
           <img src="/images/facebook.png" width="40" height="40" alt="facebook">
          </a>
          <a href="https://instagram.com" class="mx-2">
            <img src="images/instagram.png" width="40" height="40" alt="instagram" >
          </a>
          <a href="https://twitter.com" class="mx-2">
            <img src="images/twitter.png" width="40" height="40" alt="twitter" >
          </a>
        </div>
        <div class="text-muted small">
          ©
          <script>
            document.write(new Date().getFullYear());
          </script>
          - All rights reserved by ACME Industries Ltd
        </div>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
