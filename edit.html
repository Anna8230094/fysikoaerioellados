<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="edit.css" />
  </head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
  </style>
  <script src="edit.js"></script>
  

  <body>
    <header class="pb-5">
      <nav class="navbar navbar-expand-lg mb-5" id="navbar_page">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarText"
            aria-controls="navbarText"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <img
                  class="navbar-item"
                  src="myimages/fisaer.png"
                />
              </li>
              <li class="nav-item">
                <p class="navbar-text" style="color: aliceblue">
                  fysikoaerioellados
                </p>
              </li>
            </ul>
            <ul class="navbar-nav me-2 mb-2 mb-lg-0">
              <li class="nav-item">
                <button
                  type="button"
                  class="btn text-light"
                  onclick="window.location.href='login.html'"
                >
                  <img class="person" src="myimages/dia.png" height="25" />
                  Konstantia Stergiou
                </button>
              </li>
            </ul>
          </div>
        </div>
        </div>
      </nav>
    </header>
      <div class="container">
        <div class="form-box">
            <div class="notice">Έγιναν αλλαγές σε κάποια πεδία. Ελέγξτε πριν αποθηκεύσετε </div>
          <h2>Upgrade Data</h2>
          <input type="text" placeholder="Campaign name..." />
          <input type="text" placeholder="duration - dd/mm/yyyy - dd/mm/yyyy" />
          <input type="text" placeholder="requirement 1" />
          <input type="text" placeholder="requirement 2" />
          <div id="extraRequirements"></div>
          <button type="button" id="addRequirementBtn" class="save-button" style="background-color: #d9d3f6; margin-bottom: 40px;">
            + Add requirement
          </button>

          
          <input type="text" placeholder="criteria 1" />
          <input type="text" placeholder="criteria 2" />
          <div id="extraCriteria"></div>

          <button type="button" id="addCriteriaBtn" class="save-button" style="background-color: #d9d3f6; margin-top: 15px;">
            + Add criteria
          </button>
          <div class="container-fluid pt-5">
            <table class="table">
            <thead>
              <tr>
                <th scope="col">Customer Id</th>
                <th scope="col">Customer Name</th>
              </tr>
            </thead>
            <tbody>
              
                <tr>
                  <td>c0005</td>
                  <td>Νικολέτα Τσακίρη</td>
                </tr>
                <tr>
                  <td>c02001</td>
                  <td>Μαρία Γιαννοπούλου</td>
                </tr>
                <tr>
                    <td>c00255</td>
                    <td> Αλέξανδρος Δεμίρης </td>
                  </tr>
             
            </tbody>
          </table>
      
          <button type="button" id="addToTheTableBtn" class="save-button" style="margin-top: 15px;">
            + Add Customer
          </button>
          
          <button class="save-button" onclick="window.location.href='edit.html'"> Save Changes </button>
        </div>
        </div>
                
    </header>
    <script>
      window.onload = function () {
        const inputs = document.querySelectorAll("input");
        if (inputs.length >= 6) {
          inputs[0].value = "Καμπάνια για συμπλήρωση ελλειπών στοιχείων";
          inputs[1].value = "01/03/2025 - 31/05/2025";
          inputs[2].value = "Ενεργό συμβόλαιο σε πακέτο φυσικού αερίου ή ρεύματος";
          inputs[3].value = "Έχει ληξιπρόθεσμες οφειλές, λόγω μη απεσταλμένων λογαριασμών";
          inputs[4].value = "Έλλειψη διευθύνσης email, αριθμού κινητού";
          inputs[5].value = "Το email έχει αποτύχει σε προηγούμενες αποστολές";
        }
      };
    </script>
  </body>
</html>
